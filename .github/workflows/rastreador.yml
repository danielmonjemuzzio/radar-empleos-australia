name: Rastreador Empleos Australia

on:
  schedule:
    # Corre cada 2 horas en el minuto 17 (12 turnos diarios distribuidos suavemente)
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar Rastreador (Modo Anti-Bloqueo 365)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

- name: Sincronizar y guardar estado sin conflictos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add seen_jobs.json config.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizacion automatica de estado" && git push)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Rotacion de turno y empleos vistos" && git pull --rebase origin main && git push)
