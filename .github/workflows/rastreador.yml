name: Rastreador Empleos Australia

on:
  # Ejecución bajo demanda desde la pestaña Actions (se pausa al terminar las 30 ofertas)
  workflow_dispatch:
    inputs:
      ciudad:
        description: 'Ubicación donde buscas trabajo (ej: Perth, Sydney, Brisbane) o déjalo vacío para que el bot te pregunte por Telegram'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: seek-australia-monitor-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  rastrear:
    name: Barrido Top 30 (< 2 Días)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests urllib3

      - name: Preconfigurar ciudad si se ingresó manualmente en GitHub
        if: ${{ github.event.inputs.ciudad != '' }}
        run: |
          python -c "
          import json, os
          cfg = {'active_city': '${{ github.event.inputs.ciudad }}', 'last_update_id': 0, 'waiting_for_city': False}
          if os.path.exists('config.json'):
              try:
                  with open('config.json', 'r') as f:
                      old = json.load(f)
                      old['active_city'] = '${{ github.event.inputs.ciudad }}'
                      cfg = old
              except Exception:
                  pass
          with open('config.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Ejecutar Radar Multiportal (Top 30 < 48h)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

      - name: Guardar estado y pausar hasta nueva orden
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          rm -f *.tmp
          touch seen_jobs.json config.json
          git add seen_jobs.json config.json

          if git diff --staged --quiet; then
            echo "Sin cambios en archivos de estado."
            exit 0
          fi

          git commit -m "chore(radar): top 30 entregado y bot en pausa [skip ci]"

          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || true
            if git push origin HEAD:main; then
              echo "Estado guardado correctamente."
              exit 0
            fi
            sleep 3
          done
          exit 0
